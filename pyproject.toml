[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flask_s3_viewer"
dynamic = ["version"]
description = "Flask S3 Viewer is a powerful extension that makes it easy to browse S3 in any Flask application."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hidekuma", email = "d.hidekuma@gmail.com"}]
keywords = ["aws", "s3", "file", "upload", "flask", "python", "python3", "browsing", "uploader"]
classifiers = [
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "boto3>=1.34.0",
    "flask>=3.0.0,<4",
]

[project.optional-dependencies]
# Keep in sync with requirements.dev.txt.
# Usage: `pip install -e ".[dev]"`
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3]>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "build>=1.0",
]
# Google OAuth (and any future OIDC providers) ride on Authlib. Optional
# so the no-auth install stays dependency-light.
# Usage: `pip install -e ".[auth]"`
auth = [
    "authlib>=1.3.1",
]

[project.scripts]
flask_s3_viewer = "flask_s3_viewer.cli:handle"

[project.urls]
Homepage = "https://github.com/hidekuma/flask-s3-viewer"
Download = "https://github.com/hidekuma/flask-s3-viewer/releases"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = ["tests*", "test*", "example*", "i*"]

[tool.setuptools.package-data]
"flask_s3_viewer" = [
    "blueprints/templates/*.html",
    "blueprints/static/css/*.css",
    "blueprints/static/js/*.js",
    "blueprints/static/vendor/*.js",
]

[tool.setuptools.dynamic]
version = {attr = "flask_s3_viewer.__version__"}

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["docs/", "example/", "build/", "dist/", "tests/", "i/"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "click.*", "authlib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "example", "build", "dist", "i"]

[tool.ruff.lint]
# UP enabled in v1.0+: PEP 585/604 modern typing syntax. Python floor is
# 3.10 (already enforced via target-version), so `list[str]` / `X | None`
# is safe project-wide.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    # boto3 dict 응답을 다루는 코드가 많아 line length를 완화
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"flask_s3_viewer/__init__.py" = ["F401"]
